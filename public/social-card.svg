<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Journal Calendar</title>
  <desc>Monthly calendars for 5 by 8.25 inch journals, with a close-up of a January calendar and handwritten example plans.</desc>
  <defs>
    <pattern id="rows" width="300" height="14" patternUnits="userSpaceOnUse" x="807" y="96">
      <path d="M0 14H300" fill="none" stroke="#333" stroke-width="0.7" stroke-dasharray="1.2 1.2" />
    </pattern>
    <clipPath id="calendar-crop">
      <rect x="570" y="40" width="630" height="590" />
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="#f4f3ed" />
  <text x="64" y="215" fill="#263d36" font-family="Georgia, 'Times New Roman', serif" font-size="128" letter-spacing="-4">
    <tspan x="64">Journal</tspan>
    <tspan x="64" dy="130">Calendar</tspan>
  </text>
  <text x="67" y="412" fill="#64716a" font-family="Arial, Helvetica, sans-serif" font-size="32">
    <tspan x="67">Monthly calendars for</tspan>
    <tspan x="67" dy="42">5 x 8.25 in journals.</tspan>
  </text>
  <path d="M67 488H522" stroke="#d9dfd2" />
  <text x="67" y="533" fill="#315e49" font-family="Arial, Helvetica, sans-serif" font-size="28">
    <tspan x="67">Any year / 12 months</tspan>
    <tspan x="67" dy="38">Letter paper</tspan>
  </text>
  <rect x="565" y="45" width="720" height="1100" rx="2" fill="#263d36" opacity="0.08" />
  <rect x="570" y="40" width="720" height="1100" rx="2" fill="white" stroke="#d9dfd2" />
  <g clip-path="url(#calendar-crop)">
